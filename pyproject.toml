[project]
name = "trading-agent"
version = "0.1.0"
description = "moomoo OpenAPI を介して米国株・日本株の中期投資を AI マルチエージェントが支援する、ローカル完結型の個人向けトレードアシスタント"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "sworks-d" }]
license = { text = "Proprietary" }

# Phase 1.0（環境構築）で実際に使う依存のみに絞る。
# 後続フェーズで使う依存は、そのフェーズで追加する（原則4：Phase 1 で必要なものに絞る）。
# 設計書（OPERATIONS.md / CLAUDE_CODE_INSTRUCTIONS.md §5）で確定済みの将来依存：
#   Phase 1.1 : anthropic, langchain, langchain-anthropic, langchain-ollama,
#               feedparser, yfinance, ta-lib(要brew install ta-lib), httpx, tenacity,
#               jpx-jquants-api-client
#   Phase 1.2 : moomoo-api
#   Phase 1.5 : apscheduler
#   Phase 1.6 : fastapi>=0.115, uvicorn[standard]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.20",
    "alembic>=1.13",
    "structlog>=24.1",
    "tenacity>=8.0",  # Phase 1.1.1: MCP ツールのリトライ
    "yfinance>=0.2.40",  # Phase 1.1.2: 価格データ（moomoo 接続までの主ソース）
    "feedparser>=6.0",  # Phase 1.1.4: RSS パース
    "httpx>=0.27",  # Phase 1.1.4: HTTP クライアント（NewsAPI / EDINET / Ollama 等）
    "anthropic>=0.40",  # Phase 1.1.8: Claude API クライアント
    "fastapi>=0.115",  # UI 配信 + API
    "uvicorn[standard]>=0.30",  # ASGI サーバー
    "jinja2>=3.1",  # Phase 1.3.2: プロンプトのテンプレート展開
    "moomoo-api>=10.6.6608",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_agent"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 標準ライブラリ→サードパーティ→自プロジェクトの import 順序を I で強制
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["trading_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]  # scripts/ をテストから import 可能に（A-1 load_universe 等のロジック検証）
