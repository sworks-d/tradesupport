# Alembic 設定（SYSTEM_DESIGN.md §2.5）。
# Phase 1 は「Alembic 導入のみ、初期スキーマは scripts/init_db.py の create_all で稼働」。
# 実際の DB URL は alembic/env.py で動的に設定する（DB_PATH 環境変数 or 既定パス）。

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url は env.py で設定するため空のまま
sqlalchemy.url =

[post_write_hooks]
# 生成したマイグレーションを black / ruff で整形（任意）
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
